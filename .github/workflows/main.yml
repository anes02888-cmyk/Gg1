name: Build Executable App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Locate project files & Install
      run: |
        if (Test-Path "package.json") {
            npm install
        } elseif (Test-Path "src/package.json") {
            cd src
            npm install
        } else {
            $json = Get-ChildItem -Recurse -Filter "package.json" | Select-Object -First 1
            if ($json) {
                Set-Location $json.Directory.FullName
                npm install
            }
        }

    - name: Build Web App
      run: |
        $json = Get-ChildItem -Recurse -Filter "package.json" | Select-Object -First 1
        if ($json) {
            Set-Location $json.Directory.FullName
            npm run build --if-present
        }

    - name: Package App to EXE
      run: |
        $json = Get-ChildItem -Recurse -Filter "package.json" | Select-Object -First 1
        if ($json) {
            Set-Location $json.Directory.FullName
            npx --yes nativefier --name "VoiceForgeApp" "." --single-instance
        }

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v3
      with:
        name: VoiceForge-Executable-App
        path: |
          **/*win32-x64*
          **/*.exe
