name: Build Executable App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Find Project Root & Install
      run: |
        # البحث عن ملف package.json والدخول لمجلده تلقائياً
        TARGET_DIR=$(dirname $(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1))
        echo "Project found in: $TARGET_DIR"
        cd "$TARGET_DIR"
        npm install
        npm run build --if-present

    - name: Prepare Artifact
      run: |
        mkdir -p output_app
        # نقل مجلد dist أو build الناتج
        DIST_PATH=$(find . -type d \( -name "dist" -o -name "build" \) -not -path "*/node_modules/*" | head -n 1)
        if [ -n "$DIST_PATH" ]; then
          cp -r "$DIST_PATH"/* output_app/
        else
          cp -r ./* output_app/ 2>/dev/null || true
        fi

    - name: Upload Built App
      uses: actions/upload-artifact@v4
      with:
        name: VoiceForge-Built-App
        path: output_app/
