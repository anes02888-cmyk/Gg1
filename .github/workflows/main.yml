name: Build Executable App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Dependencies
      run: |
        npm install

    - name: Build Web App
      run: |
        npm run build --if-present

    - name: Package with Electron
      run: |
        npx --yes nativefier --name "VoiceForgeApp" "./dist" --single-instance

    - name: Upload App For Download
      uses: actions/upload-artifact@v3
      with:
        name: My-Executable-App
        path: VoiceForgeApp-win32-x64
