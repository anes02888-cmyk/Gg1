name: Build Executable App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Dependencies
      run: npm install

    - name: Build Web Project
      run: npm run build

    - name: Upload Output
      uses: actions/upload-artifact@v4
      with:
        name: VoiceForge-Built-App
        path: |
          dist
          build
